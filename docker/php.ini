; FOODAY — production PHP settings for the containerized deploy (Render).
;
; Copied to /usr/local/etc/php/conf.d/ so it layers on top of the image
; defaults. The official image ships no active php.ini, which leaves
; display_errors on and the upload ceilings at 2 MB — fine for a laptop,
; wrong for a JSON API behind a proxy.

; Errors are logged, never printed. Every endpoint answers in JSON, and a
; warning echoed into the body would break the response the browser parses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Do not advertise the PHP version on every response.
expose_php = Off

; Room for the app's own ceilings. A profile picture is capped at 2 MB and a
; product photo at 4 MB, and both arrive base64-encoded inside a JSON body
; (about a third larger on the wire), so post_max_size has to clear that.
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 8M

; The database, the mailer and the one-time codes all store UTC timestamps.
date.timezone = UTC

; Opcache is compiled in and enabled; the app is immutable once built, so the
; cache never needs to stat files again. Keep it big enough for api/*.php.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
