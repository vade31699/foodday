# FOODAY — Apache vhost for the containerized deploy (Render).
#
# The document root is public/, which holds only the front controller. Requests
# for the app's real files (index.html, styles.css, app.js, icons, api/*.php)
# do not exist under public/, so FallbackResource hands them to index.php, whose
# allow-list decides what is returned. Anything else is a 404 — including .env,
# fooday.sql and README.md.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
